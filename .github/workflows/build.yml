name: Build Binaries
on:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install pyinstaller PyQt5 openpyxl
      - run: python excel_parser.py
      - run: pyinstaller build_windows.spec
      - uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: dist/SAP_Simulator.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo -S -p '' apt-get install -y wget
      - run: chmod +x build_appimage.sh && ./build_appimage.sh
      - uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: SAP_Simulator-x86_64.AppImage
