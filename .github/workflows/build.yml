name: Build Binaries
on:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install pyinstaller PyQt5 openpyxl
      - run: python excel_parser.py
      - run: pyinstaller build_windows.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SAP_Simulator.exe
          path: dist/SAP_Simulator.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install pyinstaller PyQt5 openpyxl
      - run: pyinstaller build_linux.spec
      - run: chmod +x dist/SAP_Simulator
      - uses: actions/upload-artifact@v4
        with:
          name: SAP_Simulator-linux
          path: dist/SAP_Simulator
